<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2680">
<title>Grimaldo Vásquez Tan — Gobernador Regional</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --azul-vic: #1b2680;
    --azul-intenso: #2535aa;
    --azul-osc: #0b1138;
    --azul-claro: #eef3ff;
    --azul-borde: #c8d7fa;
    --rojo-vic: #e52424;
    --rojo-osc: #b81414;
    --blanco: #ffffff;
    --crema: #f4f7fc;
    --tinta: #0f172a;
    --gris: #52637a;
    --sombra: 0 10px 26px rgba(11, 17, 56, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--azul-osc) 0%, var(--azul-vic) 220px, var(--crema) 220px, var(--crema) 100%);
    min-height: 100vh;
    color: var(--tinta);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    text-align: center;
    padding: 24px 16px 20px;
    color: #fff;
    position: relative;
  }
  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 10px;
  }
  header .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover;
    border: 3.5px solid var(--rojo-vic);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    background: #fff;
    display: block;
  }
  .avatar-badge {
    position: absolute; right: -4px; bottom: 0;
    background: var(--rojo-vic); color: #fff;
    font-size: 13px; font-weight: 900;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  header h1 {
    font-size: 1.55rem; font-weight: 900; letter-spacing: .5px;
    text-transform: uppercase; line-height: 1.15;
  }
  .badge-cargo {
    display: inline-block;
    background: var(--rojo-vic);
    color: #fff;
    font-size: .8rem;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 999px;
    margin-top: 6px;
    box-shadow: 0 3px 10px rgba(229, 36, 36, .45);
  }
  header .lema {
    opacity: .9;
    font-size: .88rem;
    font-weight: 600;
    margin-top: 6px;
    color: #d6e2ff;
  }

  /* Cenefa con grecas Chachapoya */
  .grecas {
    height: 12px;
    width: 100%;
    margin-top: 14px;
    opacity: .35;
    background-image: repeating-linear-gradient(45deg, #fff 0, #fff 2px, transparent 0, transparent 8px),
                      repeating-linear-gradient(-45deg, #fff 0, #fff 2px, transparent 0, transparent 8px);
    background-size: 16px 12px;
  }

  main { max-width: 680px; margin: 0 auto; padding: 4px 16px 32px; }

  .categoria { margin-top: 22px; }
  .categoria > h2 {
    font-size: .82rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--azul-vic); font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .categoria > h2::after { content: ""; flex: 1; height: 1.5px; background: var(--azul-borde); }

  .tarjeta {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 18px; padding: 16px;
    box-shadow: var(--sombra); text-decoration: none; color: var(--tinta);
    margin-bottom: 12px; border: 2px solid transparent;
    transition: transform .08s ease, border-color .12s ease;
    cursor: pointer;
  }
  .tarjeta:active { transform: scale(.98); border-color: var(--azul-vic); }
  .tarjeta .emoji {
    font-size: 30px; width: 58px; height: 58px; flex: none;
    background: var(--azul-claro); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--azul-borde);
  }
  .tarjeta .txt { flex: 1; min-width: 0; }
  .tarjeta .txt b { font-size: 1.02rem; display: block; color: #0b1138; }
  .tarjeta .txt small { color: var(--gris); font-size: .82rem; display: block; margin-top: 3px; line-height: 1.35; }
  .tarjeta .tipo {
    flex: none; font-size: .68rem; font-weight: 800; text-transform: uppercase;
    background: var(--azul-claro); color: var(--azul-vic);
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--azul-borde);
  }
  .tarjeta .flecha { flex: none; color: var(--azul-vic); font-size: 22px; font-weight: bold; }

  .estado {
    text-align: center; font-size: .8rem; color: var(--gris);
    margin-top: 26px; padding: 0 20px; line-height: 1.5;
  }
  .estado .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .estado .punto.ok { background: #22a06b; }
  .estado .punto.off { background: var(--rojo-vic); }

  .cargando { text-align: center; padding: 40px; color: var(--gris); }
  .skel { background: #e2e8f5; border-radius: 16px; height: 84px; margin: 12px 0; }

  /* Aviso de instalación */
  #instalar {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgba(11,17,56,.3);
    padding: 14px 16px; display: none; gap: 12px; align-items: center; z-index: 50;
    border: 1.5px solid var(--azul-borde);
  }
  #instalar.mostrar { display: flex; }
  #instalar .emoji { font-size: 26px; }
  #instalar p { flex: 1; font-size: .85rem; line-height: 1.4; }
  #instalar button {
    background: var(--azul-vic); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 16px; font-weight: 800; font-size: .85rem;
  }

  /* =========================================================================
     BANNER Y SELLOS ELECTORALES (SOLO EN SOLUCIONES, NUNCA EN PROBLEMAS)
     ========================================================================= */
  .banner-soluciones-vota {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #1b2680 0%, #0b1138 100%);
    border: 2px solid var(--rojo-vic);
    border-radius: 18px;
    padding: 12px 16px;
    margin-bottom: 12px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(27, 38, 128, .2);
  }
  .banner-soluciones-vota img {
    width: 50px; height: 50px; border-radius: 10px; object-fit: contain; flex-shrink: 0;
    border: 2px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .banner-soluciones-vota .vota-txt b {
    display: block; font-size: .88rem; color: #ffd54f; letter-spacing: .5px; text-transform: uppercase;
  }
  .banner-soluciones-vota .vota-txt span {
    display: block; font-size: .78rem; color: #d6e2ff; margin-top: 2px; line-height: 1.35;
  }

  .badge-vota-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff; color: var(--azul-vic);
    border: 1.5px solid var(--rojo-vic);
    padding: 2px 8px; border-radius: 999px;
    font-size: .68rem; font-weight: 900; text-transform: uppercase;
    margin-top: 6px; width: fit-content;
  }
  .badge-vota-pill img {
    width: 14px; height: 14px; border-radius: 2px; object-fit: contain;
  }
</style>
</head>
<body>
<header>
  <div class="avatar-wrap">
    <img src="material/grimaldo-avatar.png" alt="Prof. Augusto Grimaldo Vásquez Tan" class="avatar">
    <span class="avatar-badge">✌️</span>
  </div>
  <h1>GRIMALDO VÁSQUEZ TAN</h1>
  <div class="badge-cargo">GOBERNADOR REGIONAL</div>
  <p class="lema">Tu Victoria, Nuestra Victoria · Amazonas</p>
  <div class="grecas"></div>
</header>
<main>
  <div id="menu" class="cargando">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <p class="estado"><span class="punto ok" id="pto"></span><span id="conexion">Actualizado</span><br>
  Diagnóstico y soluciones en diapositivas, letra grande para el celular.</p>
</main>

<div id="instalar">
  <span class="emoji">📲</span>
  <p><b>Instala la app:</b> menú del navegador <b>⋮</b> → «Añadir a pantalla de inicio». Queda con ícono como cualquier app.</p>
  <button id="instalar-btn">OK</button>
</div>

<script>
  const EMOJIS = { link: "🔗", slides: "📱", nota: "📝", pdf: "📄", video: "🎬" };

  ["material/grimaldo-avatar.png", "material/cedula-voto-x.png"].forEach(function (src) {
    const img = new Image();
    img.src = src;
  });

  function esLamina(it) {
    const tipo = (it.tipo || "").toLowerCase();
    const url = (it.url || "").toLowerCase();
    const titulo = (it.titulo || "").toLowerCase();
    if (tipo === "imagen") return true;
    if (/\.(png|jpe?g|webp)(\?|$)/.test(url)) return true;
    if (titulo.includes("infograf") || titulo.includes("lamina") || titulo.includes("lámina")) return true;
    if (url.includes("ruta-salud") || url.includes("ruta-educacion") || url.includes("propuesta-integral")) return true;
    return false;
  }

  async function cargar() {
    const resp = await fetch("links.json?v=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("links.json " + resp.status);
    const datos = await resp.json();
    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    for (const cat of datos.categorias || []) {
      const items = (cat.items || []).filter(function (it) { return !esLamina(it); });
      if (!items.length) continue;

      const sec = document.createElement("section");
      sec.className = "categoria";
      const h2 = document.createElement("h2");
      h2.textContent = (cat.icono || "📌") + " " + cat.nombre;
      sec.appendChild(h2);

      const esSolucion = cat.nombre.toLowerCase().includes("propuestas");
      if (esSolucion) {
        const ban = document.createElement("div");
        ban.className = "banner-soluciones-vota";
        ban.innerHTML = '<img src="material/cedula-voto-x.png" alt="Marca con una X"><div class="vota-txt"><b>PLAN DE GOBIERNO · VICTORIA AMAZONENSE</b><span>Para hacer realidad estas soluciones, en las elecciones marca con una <b>X</b></span></div>';
        sec.appendChild(ban);
      }

      for (const it of items) {
        const a = document.createElement("a");
        a.className = "tarjeta";
        a.href = it.url;
        if (it.url && it.url.startsWith("diapositivas.html")) {
          a.target = "_self";
        } else {
          a.target = "_blank";
          a.rel = "noopener";
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = it.emoji || EMOJIS[it.tipo] || "🔗";

        const txt = document.createElement("div");
        txt.className = "txt";
        const b = document.createElement("b");
        b.textContent = it.titulo;
        txt.appendChild(b);
        if (it.nota) {
          const small = document.createElement("small");
          small.textContent = it.nota;
          txt.appendChild(small);
        }
        if (esSolucion) {
          const pill = document.createElement("div");
          pill.className = "badge-vota-pill";
          pill.innerHTML = '<img src="material/cedula-voto-x.png" alt=""> Marca con una X';
          txt.appendChild(pill);
        }

        const tipo = document.createElement("span");
        tipo.className = "tipo";
        tipo.textContent = it.tipo === "link" ? "web" : "diapositivas";

        const fl = document.createElement("span");
        fl.className = "flecha";
        fl.textContent = "›";

        a.append(emoji, txt, tipo, fl);
        sec.appendChild(a);
      }
      menu.appendChild(sec);
    }

    document.getElementById("pto").className = "punto ok";
    document.getElementById("conexion").textContent = "Al día · " + (datos.actualizado || "");
  }

  cargar().catch(function () {
    document.getElementById("pto").className = "punto off";
    document.getElementById("conexion").textContent = "Sin conexión · mostrando última copia guardada";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update(); });
  }
  if ("caches" in window) {
    caches.keys().then(function (keys) {
      return Promise.all(keys.filter(function (k) { return k !== "grimaldo-hub-v7"; }).map(function (k) { return caches.delete(k); }));
    });
  }

  const aviso = document.getElementById("instalar");
  const esApp = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (!esApp && !localStorage.getItem("avisoInstalacionVisto")) {
    setTimeout(function () { aviso.classList.add("mostrar"); }, 1500);
  }
  document.getElementById("instalar-btn").addEventListener("click", function () {
    localStorage.setItem("avisoInstalacionVisto", "1");
    aviso.classList.remove("mostrar");
  });
</script>
</body>
</html>
